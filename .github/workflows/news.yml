name: 아침 뉴스 한 통

on:
  schedule:
    # 매일 한국 시간 07:17 (깃허브 시계는 한국보다 9시간 느리다 → 전날 22:17로 적는다)
    # 정각(00분)·30분은 깃허브가 붐벼 늦거나 빠질 수 있어 피했다.
    # 깃허브가 바쁘면 예약이 늦게 돌 수 있다.
    - cron: '17 22 * * *'
  workflow_dispatch:   # Actions 화면의 "Run workflow" 버튼(수동 실행). 누를 때마다 AI 1회 = 돈이 나간다.

permissions:
  contents: read

concurrency:
  group: morning-news
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 5분 넘으면 강제로 끈다(시간 낭비 방지)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 뉴스 모으기 → 요약 → 텔레그램
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python news_bot.py
